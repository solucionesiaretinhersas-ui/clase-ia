<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aula-ia:theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#f2f2f7' : '#000000');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta name="description" content="Aula IA: De la idea a la experiencia. Taller docente sobre Google AI Studio — I.E. Santa Rosa de Lima." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Aula IA · Santa Rosa de Lima</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
